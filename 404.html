<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="404 — 页面未找到">
<title>404 · 页面未找到</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="stylesheet" href="css/style.css" />
<style>
  .notfound {
    min-height: calc(100vh - var(--header-h, 64px) - 200px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 4rem 2rem;
  }
  .notfound__code {
    font-size: 7rem;
    font-weight: 900;
    font-family: var(--font-sans, sans-serif);
    line-height: 1;
    background: linear-gradient(135deg, var(--accent, #34d399), var(--link, #7dd3fc));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 0.5rem;
  }
  .notfound__title {
    font-size: 1.2rem;
    font-weight: 600;
    color: var(--text, #e8eaed);
    margin-bottom: 0.5rem;
  }
  .notfound__desc {
    color: var(--text-muted, #9aa0a8);
    font-size: 0.9rem;
    margin-bottom: 2rem;
    max-width: 400px;
    line-height: 1.6;
  }
  .notfound__action {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.7rem 1.5rem;
    border-radius: var(--radius-sm, 8px);
    background: linear-gradient(135deg, var(--accent-btn-start, #34d399), var(--accent-btn-end, #6ee7b7));
    color: #000;
    font-weight: 600;
    font-size: 0.9rem;
    text-decoration: none;
    transition: opacity 0.2s, transform 0.15s;
  }
  .notfound__action:hover {
    opacity: 0.9;
    transform: translateY(-1px);
  }
  .notfound__action:active {
    transform: scale(0.98);
  }

  /* For JS-rendered 404 in post.html */
  .notfound--inline {
    min-height: 40vh;
    padding: 3rem 2rem;
  }
  .notfound--inline .notfound__code {
    font-size: 4rem;
  }
</style>
</head>
<body data-page="404">

  <header class="site-header" id="site-header"></header>

  <main>
    <nav class="breadcrumb" aria-label="面包屑">
      <a href="index.html">首页</a>
      <span class="breadcrumb__sep">/</span>
      <span>404</span>
    </nav>

    <div class="notfound">
      <div class="notfound__code">404</div>
      <h1 class="notfound__title">页面不存在</h1>
      <p class="notfound__desc">
        你输入的地址没有对应内容。<br>
        可能是链接已失效，或者我写的东西还躺在 Obsidian 里没发布。
      </p>
      <a class="notfound__action" href="index.html">
        ← 回首页
      </a>
    </div>
  </main>

  <footer class="site-footer site-footer--rich" id="site-footer"></footer>

  <script src="js/site-config.js"></script>
  <script src="js/layout.js"></script>
  <script>
    // 404 时仍然加载布局，但面包屑修正
    document.addEventListener('DOMContentLoaded', function() {
      var bc = document.getElementById('breadcrumb-current');
      if (bc) bc.textContent = '404';
    });
  </script>
</body>
</html>
