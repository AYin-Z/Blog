# Import discussions and Giscus comments for manual approval in Obsidian.
name: Sync Discussions to Comments
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
  discussions: read
concurrency:
  group: sync-discussions-${{ github.ref }}
  cancel-in-progress: false
jobs:
  sync-discussions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Test import and approval preservation
        run: node --test .github/scripts/sync-discussions.test.cjs
      - name: Sync discussions to _comments/
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { sync } = require('./.github/scripts/sync-discussions.cjs');
            await sync(github.graphql, context.repo);
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -d _comments ]; then
            echo "No discussions or comments to import"
            exit 0
          fi
          git add _comments/
          if git diff --cached --quiet; then
            echo "No new comments"
            exit 0
          fi
          git commit -m "chore: sync discussions to _comments/"
          git push
